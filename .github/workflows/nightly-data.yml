name: Nightly data

# Weekdays at 8:30pm NZ time, about two hours after the ASX close and before the 9pm
# NZ daily cycle. GitHub schedules run in UTC, so there are two: 07:30 UTC is 8:30pm in
# NZ daylight time and 08:30 UTC is 8:30pm in NZ standard time; the gate keeps the one
# that matches the season. US prices are from the previous US session.
# Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
  # A push that changes config/run_now.txt starts an extra run (for catching up between
  # scheduled runs). The bot's own nightly commits never trigger it.
  push:
    paths:
      - config/run_now.txt

permissions:
  contents: write
  id-token: write      # lets the last step prove to Cam's Hub that the snapshot comes from this repository

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.season.outputs.go }}
    steps:
      - id: season
        run: |
          off=$(TZ=Pacific/Auckland date +%z)
          want="30 7 * * 1-5"; [ "$off" = "+1200" ] && want="30 8 * * 1-5"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"; echo "Skipping: NZ offset $off, this schedule is for the other season"
          fi
  pull:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_DRIVE: ${{ secrets.RCLONE_CONF != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free currency and rate series
        id: rates
        run: python3 -I src/fetch_public.py data
      - name: US deal filings from the SEC index, and the US deal targets list
        id: sec
        continue-on-error: true
        run: python3 -I src/fetch_sec.py data && python3 -I src/us_deals.py data 120
      - name: End-of-day prices
        id: prices
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python3 -I src/fetch_prices.py config/universe_trial.csv,config/universe_us_deals.csv data
      - name: NZX prices (FinFeedAPI, paid by usage credits)
        id: nzx
        continue-on-error: true
        env:
          FINFEED_API_KEY: ${{ secrets.FINFEED_API_KEY }}
        run: python3 -I src/fetch_nzx.py data --max-requests 15
      - name: Engine checks
        id: checks
        run: python3 -I tests/test_engine.py && python3 -I tests/test_clerk.py && python3 -I tests/test_clerk_actions.py && python3 -I tests/test_hedges.py && python3 -I tests/test_risk.py && python3 -I tests/test_decide.py && python3 -I tests/test_insider_history.py && python3 -I tests/test_deal_history.py && python3 -I tests/test_nzx.py && python3 -I tests/test_fetch.py && python3 -I tests/test_deal_odds.py && python3 -I tests/test_data_checks.py && python3 -I tests/test_au_deal_test.py && python3 -I tests/test_deal_files.py
      - name: Data checks (prices that look wrong or stale, exchange rates)
        id: datacheck
        continue-on-error: true
        run: python3 -I src/data_checks.py .
      - name: Deal monitor
        id: monitor
        continue-on-error: true
        run: python3 -I src/deal_monitor.py .
      - name: Clerk (runs only when config/run.json names an active ledger)
        id: clerk
        run: python3 -I src/daily.py
      - name: Copy to Google Drive (only once the RCLONE_CONF secret is set; see docs/DRIVE_BACKUP.md)
        if: env.HAS_DRIVE == 'true'
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -sSfL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q -j /tmp/rclone.zip '*/rclone' -d /tmp/rc && chmod +x /tmp/rc/rclone
          printf '%s' "$RCLONE_CONF" > /tmp/rc/rclone.conf
          tar czf /tmp/paper-portfolio-latest.tar.gz RULEBOOK.md README.md config deals docs ledger reports research src tests
          /tmp/rc/rclone --config /tmp/rc/rclone.conf copyto /tmp/paper-portfolio-latest.tar.gz gdrive:paper-portfolio/paper-portfolio-latest.tar.gz
          if [ "$(date -u +%u)" = "5" ]; then
            /tmp/rc/rclone --config /tmp/rc/rclone.conf copyto /tmp/paper-portfolio-latest.tar.gz "gdrive:paper-portfolio/weekly/paper-portfolio-$(date -u +%Y-%m-%d).tar.gz"
          fi
      - name: Save data
        id: save
        run: |
          git config user.name "paper-portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data config/universe_us_deals.csv config/nzx_isins.csv reports ledger
          git diff --cached --quiet && exit 0
          git commit -m "Nightly data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Send the snapshot to Cam's Hub (Portfolio tab)
        if: always()
        continue-on-error: true
        env:
          HUB_RUN_STEPS: ${{ toJSON(steps) }}
        run: python3 -I src/hub_export.py nightly --post
