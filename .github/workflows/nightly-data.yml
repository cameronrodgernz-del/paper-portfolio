name: Nightly data

# Weekdays at 8:30pm NZ time, about two hours after the ASX close and before the 9pm
# NZ daily cycle. GitHub schedules run in UTC, so there are two: 07:30 UTC is 8:30pm in
# NZ daylight time and 08:30 UTC is 8:30pm in NZ standard time; the gate keeps the one
# that matches the season. US prices are from the previous US session.
# Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.season.outputs.go }}
    steps:
      - id: season
        run: |
          off=$(TZ=Pacific/Auckland date +%z)
          want="30 7 * * 1-5"; [ "$off" = "+1200" ] && want="30 8 * * 1-5"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"; echo "Skipping: NZ offset $off, this schedule is for the other season"
          fi
  pull:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free currency and rate series
        run: python3 -I src/fetch_public.py data
      - name: US deal filings from the SEC index, and the US deal targets list
        continue-on-error: true
        run: python3 -I src/fetch_sec.py data && python3 -I src/us_deals.py data 120
      - name: End-of-day prices
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python3 -I src/fetch_prices.py config/universe_trial.csv,config/universe_us_deals.csv data
      - name: Engine checks
        run: python3 -I tests/test_engine.py && python3 -I tests/test_clerk.py && python3 -I tests/test_hedges.py
      - name: Deal monitor
        continue-on-error: true
        run: python3 -I src/deal_monitor.py .
      - name: Save data
        run: |
          git config user.name "paper-portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data config/universe_us_deals.csv reports/deal_monitor.md
          git diff --cached --quiet || git commit -m "Nightly data $(date -u +%Y-%m-%d)"
          git push
