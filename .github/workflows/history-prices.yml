name: History prices

# Fetches long price histories once each for the history tests, within Tiingo's free limits:
# up to 45 requests a run, hourly, never in the 07:00 to 09:59 UTC window the nightly job uses.
#   - config/universe_history.csv: the insider-cluster sample (rulebook 9a), from 31 Oct 2026.
#   - config/universe_history_deals.csv: the US deal sample (rulebook 9b), from 1 Nov 2026 UTC,
#     capped so the month's different symbols (nightly and history together) stay at or under 440
#     of Tiingo's 500, leaving room for the nightly job's new names.
# When every ticker in a sample is in, that sample's test runs and writes its result once.
on:
  schedule:
    # 31 Oct to 10 Nov for both samples, 1 to 4 Dec for anything the November cap held back
    - cron: "15 13-23 31 10 *"
    - cron: "15 0-6,10-23 1-10 11 *"
    - cron: "15 0-6,10-23 1-4 12 *"
  push:
    paths:
      - config/run_history.txt
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # for the snapshot sent to Cam's Hub

concurrency:
  group: history-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What is left?
        id: left
        run: |
          python3 -I - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, os
          from datetime import date
          d = "data/history/prices/US"
          def left(path):
              if not os.path.exists(path):
                  return 0
              rows = list(csv.DictReader(open(path)))
              return sum(1 for r in rows if not os.path.exists(f"{d}/{r['ticker']}.csv") and not os.path.exists(f"{d}/{r['ticker']}.csv.none"))
          ins = left("config/universe_history.csv")
          print(f"left={ins}")
          print(f"deals={left('config/universe_history_deals.csv') if date.today() >= date(2026, 11, 1) else 0}")
          print(f"done={'yes' if os.path.exists('reports/special_insider_history.md.lock') else 'no'}")
          print(f"deals_done={'yes' if os.path.exists('reports/deal_us_history.md.lock') else 'no'}")
          EOF
      - name: Tiingo's list of supported tickers (exchange and dates), once
        if: steps.left.outputs.done == 'no' && hashFiles('data/history/tiingo_supported.csv') == ''
        continue-on-error: true
        run: |
          mkdir -p data/history /tmp/sup
          curl -sSfL -o /tmp/sup/s.zip https://apimedia.tiingo.com/docs/tiingo/daily/supported_tickers.zip
          unzip -o -q /tmp/sup/s.zip -d /tmp/sup
          python3 -I - <<'EOF'
          import csv, glob
          want = {r["ticker"] for r in csv.DictReader(open("config/universe_history.csv"))}
          src = glob.glob("/tmp/sup/*.csv")[0]
          with open(src, newline="") as f, open("data/history/tiingo_supported.csv", "w", newline="") as g:
              rd = csv.DictReader(f); w = csv.DictWriter(g, fieldnames=rd.fieldnames); w.writeheader()
              w.writerows(r for r in rd if (r.get("ticker") or "").upper() in want)
          EOF
      - name: Prices, insider sample
        if: steps.left.outputs.left != '0'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python3 -I src/fetch_prices.py config/universe_history.csv data/history --start 2009-06-01 --once --tiingo-month-cap 440
      - name: Prices, deal sample (from 1 November UTC, once the insider sample is in)
        if: steps.left.outputs.left == '0' && steps.left.outputs.deals != '0'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python3 -I src/fetch_prices.py config/universe_history_deals.csv data/history --start 2014-06-01 --once --tiingo-month-cap 440
      - name: Prices, ASX deal sample (rulebook 9c), only on EODHD's paid plan
        if: hashFiles('reports/deal_au_history.md.lock') == ''
        continue-on-error: true
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: python3 -I src/fetch_prices.py config/universe_history_au_deals.csv data/history --start 2014-06-01 --once --eodhd-min-limit 1000
      - name: NZX history back to July 2023 (FinFeedAPI), 40 shares a run until done
        continue-on-error: true
        env:
          FINFEED_API_KEY: ${{ secrets.FINFEED_API_KEY }}
        run: python3 -I src/fetch_nzx.py data --backfill-from 2023-07-01 --max-requests 40
      - name: Insider test (runs once, when its sample is in)
        if: steps.left.outputs.done == 'no'
        run: python3 -I src/history/insider_test.py .
      - name: ASX deal test (runs once, when its prices are in)
        if: hashFiles('reports/deal_au_history.md.lock') == ''
        continue-on-error: true
        run: python3 -I src/history/au_deal_test.py .
      - name: Deal test (runs once, when its sample is in)
        if: steps.left.outputs.deals_done == 'no' && hashFiles('config/universe_history_deals.csv') != ''
        run: python3 -I src/history/us_deal_test.py .
      - name: Is there a new test result?
        id: newresult
        if: always()
        run: |
          if git status --porcelain reports/ | grep -q "lock\|history.md"; then echo "yes=yes" >> "$GITHUB_OUTPUT"; else echo "yes=no" >> "$GITHUB_OUTPUT"; fi
      - name: Save
        run: |
          git config user.name "paper-portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history data/prices/NZX config/nzx_isins.csv reports
          git diff --cached --quiet && exit 0
          git commit -m "History prices $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Send the snapshot to Cam's Hub (Portfolio tab), when a test result is new
        if: always() && steps.newresult.outputs.yes == 'yes'
        continue-on-error: true
        run: python3 -I src/hub_export.py history --post
