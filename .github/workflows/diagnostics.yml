name: Data diagnostics

# Run by hand from the Actions tab when a feed needs checking.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The EODHD check (src/eodhd_diag.py) ran on 31 Oct 2026: EODHD has no NZX.
      - name: FinFeedAPI NZX coverage
        env:
          FINFEED_API_KEY: ${{ secrets.FINFEED_API_KEY }}
        run: python3 -I src/finfeed_diag.py data
      - name: Save results
        run: |
          git config user.name "paper-portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/diagnostics
          git diff --cached --quiet || git commit -m "Diagnostics $(date -u +%Y-%m-%d)"
          git push
