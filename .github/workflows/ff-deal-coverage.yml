name: FinancialFilings deal target coverage

# One-off: checks whether FinancialFilings holds the substantial holder notices of the ASX deal targets
# from 2015 to 2025, one free credit a deal. Runs when this file or its script changes, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/ff_deal_coverage.py
      - .github/workflows/ff-deal-coverage.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check coverage
        env:
          FINANCIALFILINGS_API_KEY: ${{ secrets.FINANCIALFILINGS_API_KEY }}
        run: python3 -I tools/ff_deal_coverage.py .
      - name: Save
        run: |
          git config user.name "paper-portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/financialfilings/deal_coverage.csv data/financialfilings/deal_coverage.md
          git diff --cached --quiet && exit 0
          git commit -m "FinancialFilings deal target coverage $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
